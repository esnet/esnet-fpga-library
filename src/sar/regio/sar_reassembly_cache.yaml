name: sar_reassembly_cache
info: |
  This register map describes a register block for
  control and monitoring of the reassembly cache component.
regs:
  - default:
      width: 32
      access: rw
      init: 0

  - name: info_size
    desc: Info (number of IDs tracked)
    access: ro

  - name: control
    access: rw
    fields:
        - name:  reset
          desc:  (soft) block reset
          width: 1
          init:  0
        - name:  enable
          desc:  (soft) block enable
          width: 1
          init:  1

  - name: status
    access: ro
    fields:
        - name:  reset_mon
          desc:  block reset monitor
          width: 1
        - name:  enable_mon
          desc:  block enable monitor
          width: 1
        - name:  ready_mon
          desc:  block ready monitor
          width: 1

  - name: dbg_control
    access: rw
    fields:
        - name:  clear_counts
          desc:  clear all debug counters.
          width: 1
          init:  0

  - name: dbg_cnt_seg_rx
    access: ro
    desc: Count of segments received by the cache.
    width: 32

  - name: dbg_cnt_frag_create
    access: ro
    desc: Count of new fragments created (FRAGMENT_CREATE actions).
    width: 32

  - name: dbg_cnt_frag_append
    access: ro
    desc: Count of fragment append operations (FRAGMENT_APPEND actions).
    width: 32

  - name: dbg_cnt_frag_prepend
    access: ro
    desc: Count of fragment prepend operations (FRAGMENT_PREPEND actions).
    width: 32

  - name: dbg_cnt_frag_merge
    access: ro
    desc: Count of fragment merge operations (FRAGMENT_MERGE actions).
    width: 32

  - name: dbg_cnt_alloc_drop
    access: ro
    desc: Count of segments dropped due to fragment pointer allocator exhaustion.
    width: 32

  - name: dbg_cnt_lookup_error
    access: ro
    desc: Count of append/prepend lookup table misalignment errors.
    width: 32

  - name: dbg_flags
    access: rd_evt
    desc: Debug flags (clear-on-read).
    fields:
        - name: ctxt_fifo_oflow
          desc: When set, indicates overflow event on lookup context FIFO.
          width: 1
        - name: ctxt_fifo_uflow
          desc: When set, indicates underflow event on lookup context FIFO.
          width: 1
        - name: delete_q_append_oflow
          desc: When set, indicates overflow event on append deletion queue.
          width: 1
        - name: delete_q_prepend_oflow
          desc: When set, indicates overflow event on prepend deletion queue.
          width: 1
