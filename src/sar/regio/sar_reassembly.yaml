name: sar_reassembly
info: |
  This register block controls the reassembly component.

regs:
  - default:
      width  : 32
      access : ro
      init   : 0

  - name: info
    access: ro
    fields:
        - name: num_frame_buffers
          desc: Number of frame buffers supported.
          width: 16
        - name: max_fragments
          desc: Maximum number of concurrent in-flight fragments.
          width: 16

  - name: info_frame
    access: ro
    fields:
        - name: max_size
          desc: Maximum frame size (bytes).
          width: 32

  - name: control
    access: rw
    fields:
        - name:  reset
          desc:  (soft) block reset
          width: 1
          init:  0
        - name:  enable
          desc:  (soft) block enable
          width: 1
          init:  1

  - name: status
    access: ro
    fields:
        - name:  reset_mon
          desc:  block reset monitor
          width: 1
        - name:  enable_mon
          desc:  block enable monitor
          width: 1
        - name:  ready_mon
          desc:  block ready monitor
          width: 1

  - name: dbg_status
    desc: (Debug) deletion FSM status.
    access: ro
    fields:
        - name: state
          desc: Deletion FSM state.
          width: 8
          enum:
              0x0 : RESET
              0x1 : IDLE
              0x2 : PROCESS_DONE
              0x3 : PROCESS_MERGED
              0x4 : PROCESS_EXPIRED
              0x5 : NOTIFY_DONE
              0x6 : APPEND_CACHE_DELETE_REQ
              0x7 : APPEND_CACHE_DELETE_PENDING
              0x8 : PREPEND_CACHE_DELETE_REQ
              0x9 : PREPEND_CACHE_DELETE_PENDING
              0xa : DELETE_STATE_REQ
              0xb : DELETE_STATE_PENDING
              0xc : DEALLOC_PTR

  - name: dbg_control
    access: rw
    fields:
        - name:  clear_counts
          desc:  clear all debug counters.
          width: 1
          init:  0

  - name: dbg_cnt_merge_ops
    access: ro
    desc: Count of merge (fragment consolidation) operations processed.
    width: 32

  - name: dbg_cnt_done_ops
    access: ro
    desc: Count of buffer-done operations processed by deletion FSM.
    width: 32

  - name: dbg_cnt_expired_ops
    access: ro
    desc: Count of expiry operations processed by deletion FSM.
    width: 32

  - name: dbg_cnt_dealloc_ops
    access: ro
    desc: Count of fragment pointer deallocations completed.
    width: 32

  - name: dbg_flags
    access: rd_evt
    desc: Debug flags (clear-on-read).
    fields:
        - name: q_done_oflow
          desc: When set, indicates overflow event on buffer-done queue.
          width: 1
        - name: q_expired_oflow
          desc: When set, indicates overflow event on fragment-expired queue.
          width: 1
        - name: q_merged_oflow
          desc: When set, indicates overflow event on merged-fragment queue.
          width: 1
